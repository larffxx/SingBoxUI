name: release

# Tag-driven release. Signing material is supplied exclusively through
# repository secrets: when a secret is absent the matching step is skipped and
# an unsigned artifact is produced (rewrite spec §71, §74, §75). No credential
# is ever hardcoded, written into installer inputs, or printed to a log.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match an existing tag)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.27.x'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.15.0'
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Hard gate: the full test pipeline (ci.yml) must pass before anything is packaged.
  ci:
    name: Test pipeline
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    needs: ci
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Report signing mode
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "Signing enabled (certificate secret present)."
          else
            echo "::warning::APPLE_CERTIFICATE not set — building an unsigned macOS artifact."
          fi

      - name: Package (.app + .dmg, signed when secrets are present)
        run: bash scripts/package-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ github.ref_name }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$env:GITHUB_PATH"
        shell: pwsh

      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          # Neither the preinstalled NSIS nor a fresh Chocolatey install is
          # guaranteed to be on PATH, and Wails shells out to makensis itself, so
          # the directory is exported for every later step.
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsis) { Add-Content -Path $env:GITHUB_PATH -Value $nsis }
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw "makensis.exe was not found under $nsis"
          }

      - name: Report signing mode
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "Signing enabled (certificate secret present)."
          } else {
            Write-Host "::warning::WINDOWS_CERTIFICATE not set — building an unsigned Windows artifact."
          }

      - name: Package (.exe + installer, signed when secrets are present)
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Arch $env:ARCH

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - uses: actions/checkout@v4

      # Only the packaging jobs publish binaries: the reusable test pipeline also
      # uploads its own artifacts (the development app bundle, the frontend dist),
      # and merging those in shipped the app's internals as release downloads.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-release'
          merge-multiple: true

      # A download that cannot be explained is a packaging bug, not a bonus file.
      - name: Reject unexpected artifacts
        run: |
          unexpected="$(find artifacts -type f ! -name '*.dmg' ! -name '*.zip' ! -name '*.exe' -print)"
          if [ -n "$unexpected" ]; then
            echo "unexpected files in the release payload:"
            echo "$unexpected"
            exit 1
          fi

      - name: List artifacts
        run: find artifacts -type f | sort

      # Downloads are the only thing a user can verify without a certificate, so
      # the release carries a checksum list next to the binaries.
      - name: Write checksums
        run: |
          cd artifacts
          find . -type f ! -name 'SHA256SUMS' -print0 | sort -z \
            | xargs -0 shasum -a 256 | sed 's|\./||' > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
            SHA256SUMS
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
