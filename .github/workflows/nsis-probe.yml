name: NSIS probe (throwaway)

on:
  workflow_dispatch:

jobs:
  probe:
    name: Where is makensis on the runner?
    runs-on: windows-latest
    steps:
      - name: Report PATH and existing installs
        shell: pwsh
        run: |
          Write-Host "PATH=$env:PATH"
          $found = Get-Command makensis.exe -ErrorAction SilentlyContinue
          Write-Host "Get-Command makensis.exe -> $($found.Source)"
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS'),
            'C:\Program Files (x86)\NSIS',
            'C:\Program Files\NSIS'
          )
          foreach ($c in $candidates) {
            Write-Host "candidate '$c' -> $(Test-Path (Join-Path $c 'makensis.exe'))"
          }
          Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*NSIS*' } | ForEach-Object { Write-Host "dir: $($_.FullName)" }

      - name: Install through Chocolatey and export the directory
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS')
          )
          foreach ($c in $candidates) {
            Write-Host "after install '$c' -> $(Test-Path (Join-Path $c 'makensis.exe'))"
            if (Test-Path (Join-Path $c 'makensis.exe')) { Add-Content -Path $env:GITHUB_PATH -Value $c }
          }
          Write-Host "chocolatey bin:"; Get-ChildItem 'C:\ProgramData\chocolatey\bin' -Filter 'makensis*' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "shim: $($_.FullName)" }

      - name: Prove makensis runs in a later step
        shell: pwsh
        run: |
          Get-Command makensis | Select-Object -ExpandProperty Source
          makensis /VERSION
